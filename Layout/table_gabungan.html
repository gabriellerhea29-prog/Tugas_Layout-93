<!DOCTYPE html>
<html>
<head>
    <title>Table HTML dan CSS</title>
    <link rel="stylesheet" href="table_gabungan.css"
</head>
<body>
    <h2>Table Nilai Siswa</h2>
    <!-- rowspan: menggabungkan baris
        colspan : menggabungkan kolom -->
<table>
    <tr>
                <th rowspan="2">No</th>
                <th rowspan="2">Nama Siswa</th>
                <th rowspan="2">Mata Pelajaran</th>
                <th colspan="2">Nilai</th>
            </tr>
    <tr>
        <th>Ulangan 1</th>
        <th>Ulangan 2</th>
    </tr>
    <tr>
        <td>1</td>
        <td>Chloe</td>
        <td>Agama</td>
        <td>80</td>
        <td>92</td>
    </tr>
    <tr>
                <td>2</td>
                <td>Gwen</td>
                <td>IPS</td>
                <td>88</td>
                <td>93</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Rima</td>
                <td>Bahasa Indonesia</td>
                <td>92</td>
                <td>88</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Agnes</td>
                <td>IPA</td>
                <td>85</td>
                <td>93</td>
            </tr>
            <tr>
                <td>5</td>
                <td>Karina</td>
                <td>PPKN</td>
                <td>87</td>
                <td>93</td>
            </tr>
    </table>
</body>
</html>
